[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gto_solver"
version = "0.1.0"
description = "A from-scratch CFR solver for imperfect-information games, validated on poker and applied to market microstructure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    # The CLI is a user-facing feature of this project rather than an optional
    # convenience, so typer is a real dependency and `gto` is installed with the
    # package. >=0.12 for the Annotated-parameter style used throughout cli.py.
    "typer>=0.12",
]

[project.scripts]
gto = "gto_solver.cli:app"

[project.optional-dependencies]
# pytest + linting, for local development and CI. matplotlib is included so CI
# actually exercises the chart code rather than skipping over it; the package
# itself never imports it outside gto_solver.benchmark.plots.
dev = [
    "pytest",
    "ruff",
    # >=3.6 for the legend's ncols argument, which the chart layout depends on.
    "matplotlib>=3.6",
    # So CI actually drives the dashboard rather than skipping over it. It is a
    # 20-second install and AppTest runs the real app, which is worth it for a
    # surface nothing else exercises.
    "streamlit>=1.28",
]
# Charts for benchmark results. Optional: the solver, the metrics and the whole
# test suite run without it, and only `gto benchmark`'s plotting needs it.
viz = [
    "matplotlib>=3.6",
]
# The interactive dashboard. Optional and heavier than everything else here, so it
# is not pulled in by default; nothing in the package imports gto_solver.dashboard.
# >=1.28 for streamlit.testing.v1.AppTest, which the dashboard's tests drive it with.
dashboard = [
    "streamlit>=1.28",
    "matplotlib>=3.6",
]
# Reserved for the Deep CFR phase (neural regret approximation); no heavy
# dependency is pulled in until that phase starts.
# nn = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
